# /etc/apache2/sites-available/grocery.yoshihamkorori.work.conf
#
# 【手順1】まずこのファイルでLet's Encrypt証明書を取得する
# 【手順2】certbot実行後、自動でHTTPS設定が追記される
#
# 配置方法:
#   sudo cp apache/grocery.yoshihamkorori.work.conf /etc/apache2/sites-available/
#   sudo a2ensite grocery.yoshihamkorori.work.conf
#   sudo a2enmod proxy proxy_http headers
#   sudo systemctl reload apache2

<VirtualHost *:80>
    ServerName grocery.yoshihamkorori.work

    # Let's Encrypt の認証用（certbot が使う）
    Alias /.well-known/acme-challenge/ /var/www/html/.well-known/acme-challenge/

    # Docker内NginxにHTTPリバースプロキシ
    ProxyPreserveHost On
    ProxyRequests Off

    ProxyPass /.well-known/acme-challenge/ !
    ProxyPass / http://127.0.0.1:8880/
    ProxyPassReverse / http://127.0.0.1:8880/

    # 実クライアントIPをDockerに伝える
    RequestHeader set X-Forwarded-Proto "http"
    RequestHeader set X-Real-IP "%{REMOTE_ADDR}s"

    ErrorLog ${APACHE_LOG_DIR}/grocery_error.log
    CustomLog ${APACHE_LOG_DIR}/grocery_access.log combined
</VirtualHost>

